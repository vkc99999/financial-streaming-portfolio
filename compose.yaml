name: financial-streaming-portfolio

x-flink: &flink
  build: ./flink
  image: financial-streaming-flink:local
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      taskmanager.numberOfTaskSlots: 2
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 1536m
      state.checkpoints.dir: file:///opt/flink/checkpoints
      restart-strategy.type: fixed-delay
      restart-strategy.fixed-delay.attempts: 3
      restart-strategy.fixed-delay.delay: 5s
  volumes:
    - checkpoints:/opt/flink/checkpoints

services:
  source:
    build:
      context: ./db
      dockerfile: Dockerfile.source
    image: financial-streaming-source:local
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4]
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_DB: finance
      POSTGRES_PASSWORD: ${SOURCE_PASSWORD:?Run python3 scripts/control.py init}
      APP_PASSWORD: ${APP_PASSWORD:?}
      CDC_PASSWORD: ${CDC_PASSWORD:?}
    volumes:
      - source_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U source_admin -d finance && psql -U source_admin -d finance -Atc 'SELECT 1 FROM invoice LIMIT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
  analytics:
    build:
      context: ./db
      dockerfile: Dockerfile.analytics
    image: financial-streaming-analytics:local
    environment:
      POSTGRES_USER: analytics_admin
      POSTGRES_DB: analytics
      POSTGRES_PASSWORD: ${ANALYTICS_PASSWORD:?}
      WRITER_PASSWORD: ${WRITER_PASSWORD:?}
      READER_PASSWORD: ${READER_PASSWORD:?}
    volumes:
      - analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U analytics_admin -d analytics && psql -U analytics_admin -d analytics -Atc 'SELECT 1 FROM invoice_line_current LIMIT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null]
      interval: 5s
      timeout: 10s
      retries: 30
  connect:
    image: quay.io/debezium/connect:3.0.8.Final
    ports: [127.0.0.1:18083:8083]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: finance-connect
      CONFIG_STORAGE_TOPIC: finance_connect_configs
      OFFSET_STORAGE_TOPIC: finance_connect_offsets
      STATUS_STORAGE_TOPIC: finance_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      source: {condition: service_healthy}
      kafka: {condition: service_healthy}
  jobmanager:
    <<: *flink
    command: jobmanager
    ports: [127.0.0.1:18081:8081]
  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on: [jobmanager]
  sql-client:
    <<: *flink
    profiles: [tools]
    command: [/opt/flink/bin/sql-client.sh, -f, /sql/invoice.sql]
    volumes:
      - ./.runtime:/sql:ro
    depends_on: [jobmanager, taskmanager]
  api:
    build: .
    ports: [127.0.0.1:18780:8000]
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?}
      READER_PASSWORD: ${READER_PASSWORD:?}
      API_KEY: ${API_KEY:?}
    depends_on:
      source: {condition: service_healthy}
      analytics: {condition: service_healthy}

volumes:
  source_data:
  analytics_data:
  kafka_data:
  checkpoints:
